<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Stars Manager</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; }
    input { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 20px; }
    .star { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
    .star h3 { margin: 0 0 5px; }
    .star h3 a { color: #0366d6; text-decoration: none; }
    .star p { margin: 5px 0; color: #666; }
    .star button { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
    .star button:hover { background: #c82333; }
  </style>
</head>
<body>
  <h1>GitHub Stars</h1>
  <input type="text" id="search" placeholder="Search stars...">
  <div id="stars"></div>
  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
    }
    function escapeJs(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"');
    }
    async function loadStars() {
      try {
        const q = document.getElementById('search').value;
        const res = await fetch('/api/stars?q=' + encodeURIComponent(q));
        if (!res.ok) throw new Error('Failed to load stars');
        const stars = await res.json();
        const container = document.getElementById('stars');
        container.innerHTML = stars.map(s => `
          <div class="star">
            <h3><a href="${escapeHtml(s.url)}" target="_blank">${escapeHtml(s.full_name)}</a></h3>
            <p>${escapeHtml(s.description) || 'No description'}</p>
            <p><small>Language: ${escapeHtml(s.language) || 'N/A'} | ID: ${s.id}</small></p>
            <button onclick="unstar('${escapeJs(s.full_name)}')">Unstar</button>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('stars').innerHTML = '<p style="color:red">Error loading stars: ' + escapeHtml(err.message) + '</p>';
      }
    }
    async function unstar(name) {
      if (!confirm('Unstar ' + name + '?')) return;
      try {
        const res = await fetch('/api/stars/' + encodeURIComponent(name), { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to unstar');
        loadStars();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
    document.getElementById('search').addEventListener('input', loadStars);
    loadStars();
  </script>
</body>
</html>
